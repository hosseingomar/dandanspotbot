services:
  - type: web
    name: spotify-downloader-bot
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHECK_INTERVAL_SECONDS
        value: 60
      - key: AUDIO_BITRATE
        value: 256
